name: fetch-clips
on:
  push:
    branches: [media]
    paths: ['clips/requests/*.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: media
      - name: Download requested Pexels clips
        run: |
          set -e
          for req in clips/requests/*.txt; do
            day=$(basename "$req" .txt)
            mkdir -p "clips/$day"
            while read -r name url; do
              [ -z "$name" ] && continue
              case "$url" in
                https://videos.pexels.com/*) ;;
                https://www.pexels.com/download/video/*) echo "$url" | grep -Eq '^https://www\.pexels\.com/download/video/[0-9]+/?$' || { echo "skip $url"; continue; } ;;
                *) echo "skip $url"; continue;;
              esac
              case "$name" in *[!A-Za-z0-9._-]*) echo "bad name $name"; continue;; esac
              [ -f "clips/$day/$name" ] && continue
              curl -fsSL -A "Mozilla/5.0" --max-filesize 120000000 -o "clips/$day/$name.src" "$url" || { echo "FAILED $name $url"; continue; }
              # shrink to 720x1280-ish so the repo stays small
              ffmpeg -nostdin -loglevel error -y -i "clips/$day/$name.src" -t 20 -an -vf "scale=720:1280:force_original_aspect_ratio=increase,crop=720:1280" -c:v libx264 -crf 23 -preset veryfast "clips/$day/$name" && rm "clips/$day/$name.src"
            done < "$req"
          done
      - name: Commit
        run: |
          git config user.name "6AM MONEY bot"
          git config user.email "actions@users.noreply.github.com"
          git add clips
          git diff --cached --quiet || git commit -m "Add requested clips"
          git push origin HEAD:media
