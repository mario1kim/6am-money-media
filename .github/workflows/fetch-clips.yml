name: fetch-clips
on:
  push:
    branches: [media]
    paths: ['clips/requests/*.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: media
      - name: Download requested Pexels clips
        run: |
          set -e
          for req in clips/requests/*.txt; do
            day=$(basename "$req" .txt)
            mkdir -p "clips/$day"
            while read -r name url; do
              [ -z "$name" ] && continue
              case "$url" in https://videos.pexels.com/*) ;; *) echo "skip $url"; continue;; esac
              case "$name" in *[!A-Za-z0-9._-]*) echo "bad name $name"; continue;; esac
              [ -f "clips/$day/$name" ] && continue
              curl -fsSL --max-filesize 60000000 -o "clips/$day/$name" "$url"
            done < "$req"
          done
      - name: Commit
        run: |
          git config user.name "6AM MONEY bot"
          git config user.email "actions@users.noreply.github.com"
          git add clips
          git diff --cached --quiet || git commit -m "Add requested clips"
          git push origin HEAD:media
